# Kontrola při každém pushi a pull requestu: testy, typová kontrola a produkční build.
name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kontrola-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalace závislostí
        run: npm ci
      - name: Testy
        run: npm test
      - name: Typová kontrola a build
        run: npm run build
